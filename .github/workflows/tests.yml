# The suite has no dependencies and makes no network calls, so CI is the same
# command a developer runs locally, on the Node versions this ships against.
# There is nothing to install and nothing to cache.
#
# It also runs on every push to master, which is the branch GitHub Pages
# publishes from. Pages deploys whatever is on that branch regardless of what
# this says, so a red run here is a warning rather than a gate -- read it before
# opening the site on a phone.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/run.js
